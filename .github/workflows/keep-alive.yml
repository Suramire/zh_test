name: Keep Render Alive

on:
  schedule:
    # Render 免费实例 15 分钟无请求就休眠，这里 10 分钟探一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://zh-test.onrender.com/health)
          echo "HTTP $code"
          test "$code" = "200"
